<div id="snooker-character-preview"></div>
<style>
#snooker-character-preview .snooker-character-inspector { background: #101b19; color: #edf4ee; font: 14px system-ui, sans-serif; width: 100%; }
#snooker-character-preview .snooker-inspector-stage { width: 100%; height: clamp(360px, 120vw, 560px); }
#snooker-character-preview canvas { display: block; max-width: 100%; }
#snooker-character-preview .snooker-inspector-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px; }
#snooker-character-preview button { min-height: 44px; padding: 8px 12px; font: inherit; background: #203b31; color: #edf4ee; border: 1px solid #507360; border-radius: 6px; cursor: pointer; }
#snooker-character-preview button[aria-pressed="true"] { background: #c8ad68; color: #15231b; }
#snooker-character-preview button:disabled { opacity: .5; cursor: default; }
#snooker-character-preview label { display: flex; align-items: center; gap: 6px; min-height: 44px; }
#snooker-character-preview .snooker-inspector-status { padding: 0 12px 10px; }
#snooker-character-preview button.snooker-preview-spin { position: relative; width: 88px; height: 88px; padding: 0; border-radius: 50%; background: #faf8ed; touch-action: none; flex-shrink: 0; }
#snooker-character-preview .snooker-preview-spin span { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #ce2424; transform: translate(-50%, -50%); pointer-events: none; }
</style>
