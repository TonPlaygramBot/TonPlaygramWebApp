services:
  - type: web
    runtime: node
    # This must match the public host used by the Telegram/native clients.
    # Keeping a second, suspended `tonplaygram-api` service here meant the
    # profile client reached a different database-backed deployment than the
    # service managed by this blueprint.
    name: tonplaygram-bot
    branch: main
    rootDir: bot
    # bot's postinstall also installs/builds the embedded chess module.
    buildCommand: npm install && npm --prefix ../webapp install && WEBAPP_BUILD_MAX_OLD_SPACE_SIZE=1536 npm --prefix ../webapp run build
    startCommand: npm start
    # Do not route profile traffic until this deployment has its MongoDB
    # connection. A process-only health check can pass while profile queries
    # are still buffered waiting for the database.
    healthCheckPath: /api/health
    disk:
      name: protest-media
      mountPath: /var/data/tonplaygram
      sizeGB: 10
    # Keep existing secret values in Render; prompt only when creating a Blueprint.
    envVars:
      - key: MONGO_URI
        sync: false
      - key: BOT_TOKEN
        sync: false
      # Force webhook delivery on the canonical service. Render otherwise
      # exposes only RENDER_EXTERNAL_HOSTNAME, and falling back to long polling
      # lets overlapping deploy instances trigger Telegram's 409 conflict.
      - key: TELEGRAM_WEBHOOK_URL
        value: https://tonplaygram-bot.onrender.com
      # Recommended (set these in Render, even if some are optional):
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: WITHDRAW_ENABLED
        value: "false"
      - key: MOBILE_STORE_MODE
        value: "true"
      - key: CLAIM_CONTRACT_ADDRESS
        sync: false
      - key: CLAIM_WALLET_MNEMONIC
        sync: false
      - key: MATCHMAKING_SERVICE_SECRET
        sync: false
      - key: VITE_MATCHMAKING_URL
        value: wss://tonplaygram-bot.onrender.com/colyseus
      # Bake the public API into web/native bundles. Same-origin remains the
      # browser fallback, while installed iOS shells cannot use capacitor://localhost.
      - key: VITE_API_BASE_URL
        value: https://tonplaygram-bot.onrender.com
      - key: RPC_URL
        sync: false
      - key: DEV_ACCOUNT_ID
        sync: false
      # Community photos and videos must outlive API restarts and deployments.
      - key: FLAMINGO_UPLOAD_DIR
        value: /var/data/tonplaygram/flamingo-uploads
      - key: FLAMINGO_PERSISTENT_MOUNT_PATH
        value: /var/data/tonplaygram
      # One-megabyte resumable requests survive slow portrait-phone cellular
      # uplinks without hitting the proxy/browser request timeout.
      - key: FLAMINGO_UPLOAD_CHUNK_BYTES
        value: 1048576
      # The mounted Render disk is the durable source for wall media. Keeping
      # a second copy in MongoDB GridFS exhausts the database quota and blocks
      # otherwise valid video posts even though the media disk has space.
      - key: FLAMINGO_GRIDFS_BACKUP
        value: "false"
      # For scalable direct media uploads, configure FLAMINGO_MEDIA_STORAGE=s3
      # and the bucket credentials in the service environment after following
      # docs/social-wall-object-storage.md. Credentials must remain server-only.
      - key: SOCIAL_PROVIDER_MODE
        value: disabled
