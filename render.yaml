services:
  - type: web
    runtime: node
    name: tonplaygram-api
    branch: main
    rootDir: bot
    buildCommand: npm install && npm --prefix ../webapp install && WEBAPP_BUILD_MAX_OLD_SPACE_SIZE=1536 npm --prefix ../webapp run build
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        fromSecret: MONGO_URI
      - key: BOT_TOKEN
        fromSecret: BOT_TOKEN
      # Recommended (set these in Render, even if some are optional):
      - key: ALLOWED_ORIGINS
        fromSecret: ALLOWED_ORIGINS
      - key: API_AUTH_TOKEN
        fromSecret: API_AUTH_TOKEN
      - key: OWNER_TELEGRAM_ID
        fromSecret: OWNER_TELEGRAM_ID
      - key: WITHDRAW_ENABLED
        value: false
      - key: MOBILE_STORE_MODE
        value: true
      - key: CLAIM_CONTRACT_ADDRESS
        fromSecret: CLAIM_CONTRACT_ADDRESS
      - key: CLAIM_WALLET_MNEMONIC
        fromSecret: CLAIM_WALLET_MNEMONIC
      - key: MATCHMAKING_SERVICE_SECRET
        fromSecret: MATCHMAKING_SERVICE_SECRET
      - key: VITE_MATCHMAKING_URL
        value: wss://tonplaygram-chess-matchmaking.onrender.com
      - key: RPC_URL
        fromSecret: RPC_URL
      - key: DEV_ACCOUNT_ID
        fromSecret: DEV_ACCOUNT_ID
      - key: SOCIAL_PROVIDER_MODE
        value: disabled

  - type: web
    runtime: node
    name: tonplaygram-chess-matchmaking
    branch: main
    rootDir: chess-multiplayer-server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AUTH_REQUIRED
        value: true
      - key: ACCOUNT_API_URL
        value: https://tonplaygram-api.onrender.com
      - key: MATCHMAKING_SERVICE_SECRET
        fromSecret: MATCHMAKING_SERVICE_SECRET
      - key: REDIS_URL
        fromSecret: REDIS_URL
