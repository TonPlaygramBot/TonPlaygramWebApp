name: Tirana terrain georeferencing
'on':
  pull_request:
    paths:
      - 'webapp/src/games/tirana-region/**'
      - 'webapp/scripts/tirana/**'
      - 'tools/geography/**'
      - 'test/tirana*'
      - '.github/workflows/tirana-terrain-precision.yml'
  push:
    branches: ['codex/tirana-terrain-precision-20260908']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terrain-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 rasterio==1.5.0 pyproj==3.7.2
      - name: Regional contracts and geographic sampling
        run: node --test test/tiranaRegionalDetails.test.mjs test/tiranaRegionSource.test.mjs test/tiranaRegionalValidation.test.mjs test/tiranaTerrainPrecision.test.mjs
      - name: Real GeoTIFF processing on synthetic fixtures, not a survey claim
        run: python test/tiranaDemImport.test.py
