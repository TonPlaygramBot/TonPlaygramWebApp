name: Tirana shared landmark validation
on:
  push:
    branches: [feat/tirana-shared-landmarks]
  pull_request:
    paths:
      - 'webapp/src/games/tirana-landmarks/**'
      - 'test/tiranaLandmark*'
      - '.github/workflows/tirana-landmarks.yml'
permissions:
  contents: read
jobs:
  landmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Placement regression
        run: node --experimental-strip-types --test test/tiranaLandmarkPlacement.test.mjs
      - name: Prepare isolated renderer validation fixture
        run: |
          mkdir -p /tmp/tirana-validation/source /tmp/tirana-validation/runtime
          git archive HEAD webapp/src/games webapp/package.json test docs/tirana-landmark-placement.md | tar -x -C /tmp/tirana-validation/source
          cd /tmp/tirana-validation/runtime
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund three@0.164.1 react@18.3.1 react-dom@18.3.1 @types/three@0.164.1 @types/react@18.3.1 @types/react-dom@18.3.0 typescript@5.9.2 esbuild@0.25.9
          tar -czf /tmp/tirana-validation.tar.gz -C /tmp/tirana-validation source runtime
      - uses: actions/upload-artifact@v4
        with:
          name: tirana-renderer-validation-fixture
          path: /tmp/tirana-validation.tar.gz
          retention-days: 3
