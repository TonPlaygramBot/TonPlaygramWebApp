name: Android debug APK (testing launcher)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. launcher-v1)"
        required: true
        default: "launcher-latest"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix webapp

      - name: Generate native assets
        run: npm --prefix webapp run generate:native-assets

      - name: Build webapp
        run: npm --prefix webapp run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor
        working-directory: webapp
        run: npx --no-install cap sync android

      - name: Build debug APK
        working-directory: webapp/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp webapp/android/app/build/outputs/apk/debug/app-debug.apk tonplaygram-launcher.apk
          ls -la tonplaygram-launcher.apk

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: TonPlaygram Android Debug Launcher (testing only)
          prerelease: true
          body: "Debug-signed testing build. Not a Google Play production release. Use the Android store release workflow for a signed AAB."
          files: tonplaygram-launcher.apk
          fail_on_unmatched_files: true
