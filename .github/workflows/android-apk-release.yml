name: Android APK (launcher)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag used by the permanent homepage download"
        required: true
        default: "launcher-latest"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm run install-all

      - name: Build webapp
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          VITE_SOCKET_PATH: ${{ secrets.VITE_SOCKET_PATH }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm --prefix webapp run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor
        working-directory: webapp
        run: npx cap sync android

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > webapp/android/release.keystore
          cat > webapp/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed, locally bundled APK
        working-directory: webapp/android
        run: ./gradlew assembleRelease

      - name: Verify and prepare APK
        run: |
          cp webapp/android/app/build/outputs/apk/release/app-release.apk tonplaygram-launcher.apk
          unzip -l tonplaygram-launcher.apk | grep -q 'assets/public/index.html'
          unzip -l tonplaygram-launcher.apk | grep -q 'assets/public/assets/'
          test "$(stat -c%s tonplaygram-launcher.apk)" -gt 1000000

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TonPlaygram-Android
          path: tonplaygram-launcher.apk
          if-no-files-found: error

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: TonPlaygram Android App
          prerelease: false
          make_latest: true
          files: tonplaygram-launcher.apk
          fail_on_unmatched_files: true
