name: Signed Android app download

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag (for example android-v1.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: mobile-store-release
    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
      VITE_SOCKET_PATH: ${{ secrets.VITE_SOCKET_PATH }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate release configuration
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          node --input-type=module -e 'const u = new URL(process.env.VITE_API_BASE_URL); if (u.protocol !== "https:") throw new Error("Release API must use HTTPS");'
      - name: Install and build the complete web application
        working-directory: webapp
        run: |
          npm ci
          npm run fetch:gradle-wrapper
          npm run generate:native-assets
          npm run build
          npx cap sync android
      - name: Configure release signing
        working-directory: webapp/android
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/tonplaygram-release.jks
          cat > keystore.properties <<EOF
          storeFile=tonplaygram-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build signed installable APK
        working-directory: webapp/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify and prepare download
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose webapp/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp webapp/android/app/build/outputs/apk/release/app-release.apk release/tonplaygram.apk
          cd release
          sha256sum tonplaygram.apk > tonplaygram.apk.sha256
      - name: Retain installable APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: tonplaygram-signed-apk
          path: release/*
          if-no-files-found: error
      - name: Prepare draft download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TonPlaygram Android
          draft: true
          files: |
            release/tonplaygram.apk
            release/tonplaygram.apk.sha256
          fail_on_unmatched_files: true
      - name: Remove signing material
        if: always()
        run: rm -f webapp/android/app/tonplaygram-release.jks webapp/android/keystore.properties
