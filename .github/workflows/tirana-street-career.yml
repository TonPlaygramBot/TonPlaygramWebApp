name: Tirana street career
on:
  pull_request:
    paths:
      - 'webapp/src/games/tiranastreets/**'
      - 'webapp/src/games/tirana-landmarks/**'
      - 'webapp/src/games/tirana-city-source/**'
      - 'webapp/src/games/blackwater/**'
      - 'bot/services/blackwater.js'
      - 'webapp/src/games/tabletennis/options.ts'
      - 'webapp/src/config/chessBattleInventoryConfig.js'
      - 'test/tirana*'
      - 'webapp/public/assets/tirana-streets/living/operator.glb'
      - 'webapp/public/assets/tirana-streets/skanderbeg-building/**'
      - '.github/workflows/tirana-street-career.yml'
permissions:
  contents: read
concurrency:
  group: tirana-street-career-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/tiranaFullBodyCareer.test.mjs test/tiranaStreetCareer.test.mjs test/tiranaStreetCareer.integration.test.mjs test/tiranaCityLife.test.mjs test/tiranaCareerExpansion.test.mjs test/tiranaGameplayOverhaul.test.mjs test/tiranaMobileRuntime.test.mjs test/tiranaNpcMotion.test.mjs test/tiranaBattlefieldTactics.test.mjs test/tiranaBattlefieldSurface.test.mjs test/tiranaMissionDirector.test.mjs test/tiranaCrowdResponse.test.mjs
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --prefix webapp
      - name: Mobile pointer ownership and framebuffer budget
        run: npm run test:navigation --prefix webapp -- src/games/tiranastreets/MovementStick.navigation.test.jsx src/games/tiranastreets/TiranaHud.navigation.test.jsx src/games/tiranastreets/MissionReview.navigation.test.jsx --maxWorkers=1 --minWorkers=1
      - name: Real-rig and pointer-ownership tests
        run: node --test test/tiranaFullBodyPresentation.test.mjs test/tiranaGameplayPresentation.test.mjs test/tiranaPlayerExperience.test.mjs test/tiranaDriverBattlefield.test.mjs
      - name: Character, vehicle, landmark and streaming regressions
        run: >-
          node --test --test-concurrency=2
          test/tiranaCareerLoadingFlightInput.test.cjs
          test/tiranaHeldWeaponLoading.test.mjs
          test/tiranaHumanAnimation.test.mjs
          test/tiranaImpactPresentation.test.mjs
          test/tiranaCombatFeedback.test.mjs
          test/tiranaAlbanianForcesRuntime.test.mjs
          test/tiranaBattlefieldCombatLoop.test.mjs
          test/tiranaPopulation.test.mjs
          test/tiranaShopTerrain.test.mjs
          test/tiranaPedestrianDefense.test.mjs
          test/tiranaPedestrianDefenseGameplay.test.mjs
          test/tiranaRollingWheels.test.mjs
          test/tiranaSkanderbegBuilding.test.mjs
          test/tiranaVehicleDamageFlight.test.mjs
          test/tiranaVisibilityBudget.test.cjs
      - name: Focused Tirana typecheck
        working-directory: webapp
        run: npx --no-install tsc -p tsconfig.tirana-gameplay.json --pretty false
      - run: npm run build --prefix webapp
      - name: Dependency-aware typecheck (no error suppression)
        working-directory: webapp
        run: npx --no-install tsc --noEmit
