name: Tirana modes social exploration and Grand racing
on:
  pull_request:
    paths:
      - 'webapp/src/games/tirana-social/**'
      - 'webapp/src/games/tirana-environment/**'
      - 'webapp/src/games/kartroyale/**'
      - 'webapp/src/games/blackwater/ui.tsx'
      - 'webapp/src/games/tirana-expansion/WorldEnhancements.ts'
      - 'webapp/src/games/tiranastreets/street-career/sharedCastCore.mjs'
      - 'webapp/src/pages/Games/TiranaStreetsLobby.jsx'
      - 'bot/services/*TiranaStreets.js'
      - 'bot/services/tiranaStreets.js'
      - 'bot/services/exploreRooms.mjs'
      - 'test/tirana*'
      - 'test/fixtures/tiranaRaceSourcePair.json'
      - '.github/workflows/tirana-social-grand.yml'
permissions:
  contents: read
concurrency:
  group: tirana-social-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install unchanged repository dependency lockfiles
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix bot --no-audit --no-fund
          npm ci --prefix webapp --no-audit --no-fund
      - name: Social consent, bounds, sources and actual AI race completion
        run: node --test test/tiranaSocialExplore.test.mjs test/tiranaGrandCircuits.test.mjs test/tiranaExploreMediaGround.test.mjs test/tiranaSocialGrand.integration.test.mjs test/tiranaStreetCareer.test.mjs test/tiranaStreetDetail.test.mjs test/tiranaRegionalDetails.test.mjs test/tiranaRegionSource.test.mjs test/tiranaRegionalValidation.test.mjs
      - name: Existing registered city sockets and gameplay regressions
        run: node --test test/tiranaStreets.test.mjs test/tiranaStreetsSocket.test.mjs test/tiranaCareerExpansion.test.mjs
      - name: Full dependency-aware application type check
        run: cd webapp && npx tsc --noEmit -p tsconfig.json
      - name: Full production webapp build
        run: npm --prefix webapp run build
