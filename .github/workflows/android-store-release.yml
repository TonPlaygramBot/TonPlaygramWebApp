name: Android store release

on:
  workflow_dispatch:
    inputs:
      native_bundle_max_bytes:
        description: "Uncompressed web asset budget in bytes (project default: 200 MiB)"
        default: "209715200"
        required: false
        type: string
      native_bundle_size_override_reason:
        description: "Required reason when raising the project size budget"
        required: false
        type: string

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    environment: mobile-store-release
    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
      VITE_SOCKET_PATH: ${{ secrets.VITE_SOCKET_PATH }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate release secrets
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          node --input-type=module <<'NODE'
          let api;
          try { api = new URL(process.env.VITE_API_BASE_URL); } catch {}
          if (!api || api.protocol !== 'https:' || api.username || api.password) {
            throw new Error('VITE_API_BASE_URL must be an HTTPS URL without embedded credentials.');
          }
          NODE
      - name: Install and build web assets
        run: |
          npm ci --prefix webapp
          npm --prefix webapp run generate:native-assets
          npm --prefix webapp run build
      - name: Test native bundle-size gate
        working-directory: webapp
        run: npm run test:native-size

      - name: Check native bundle size before copying or signing
        working-directory: webapp
        env:
          NATIVE_BUNDLE_MAX_BYTES: ${{ inputs.native_bundle_max_bytes || '209715200' }}
          NATIVE_BUNDLE_SIZE_OVERRIDE_REASON: ${{ inputs.native_bundle_size_override_reason }}
        run: npm run check:native-size

      - name: Sync Capacitor Android
        working-directory: webapp
        run: npx --no-install cap sync android
      - name: Configure signing
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > webapp/android/tonplaygram-upload.jks
          cat > webapp/android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/webapp/android/tonplaygram-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build signed release AAB
        working-directory: webapp/android
        run: ./gradlew --no-daemon clean bundleRelease
      - name: Verify signing certificate
        run: keytool -printcert -jarfile webapp/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: tonplaygram-signed-release-aab
          path: webapp/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
