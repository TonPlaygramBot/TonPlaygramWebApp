name: Tabletop games
on:
  pull_request:
    paths:
      - 'webapp/src/games/tabletop/**'
      - 'bot/services/tabletop*'
      - 'bot/models/TabletopMatch.js'
      - 'bot/config/onlineGamePolicy.js'
      - 'bot/config/tpgGameContracts.js'
      - 'bot/server.js'
      - 'test/tabletop*'
      - 'bot/tests/tabletop*'
      - 'webapp/vitest.tabletop.config.mjs'
      - '.github/workflows/tabletop-games.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json
            webapp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix bot --ignore-scripts
      - run: npm ci --prefix webapp --ignore-scripts
      - run: npm run test:tabletop
      - run: npm run test:tabletop --prefix webapp
      - run: node webapp/node_modules/typescript/lib/tsc.js --noEmit --allowJs --checkJs false --jsx react-jsx --moduleResolution bundler --module esnext --target es2022 --skipLibCheck --esModuleInterop webapp/src/games/tabletop/Game.tsx webapp/src/games/tabletop/Lobby.tsx webapp/src/games/tabletop/Room.tsx
