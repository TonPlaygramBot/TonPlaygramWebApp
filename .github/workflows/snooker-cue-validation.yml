name: Snooker cue validation
on:
  push:
    branches: [fix/snooker-visible-cue-strike]
permissions:
  contents: read
jobs:
  cue-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare reproducible offline test environment
        run: |
          mkdir -p /tmp/snooker-check/source /tmp/snooker-check/runtime
          git archive HEAD | tar -x -C /tmp/snooker-check/source
          cd /tmp/snooker-check/runtime
          npm init -y
          npm install --ignore-scripts three@0.164.1 react@18.3.1 react-dom@18.3.1 esbuild@0.25.9 vite@4.5.14 @vitejs/plugin-react@4.7.0 tailwindcss@3.4.17 postcss@8.5.6 autoprefixer@10.4.21 lucide-react@0.525.0 react-router-dom@6.30.1 socket.io-client@4.8.1 typescript@5.9.2 jest@29.7.0 @babel/preset-env@7.28.3 @babel/preset-react@7.27.1
          tar -czf /tmp/snooker-check-environment.tar.gz -C /tmp/snooker-check source runtime
      - uses: actions/upload-artifact@v4
        with:
          name: snooker-cue-check-environment
          path: /tmp/snooker-check-environment.tar.gz
          retention-days: 3
