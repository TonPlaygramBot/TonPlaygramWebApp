name: Creator Studio
on:
  pull_request:
    paths:
      - 'bot/creator/**'
      - 'shared/socialApp.js'
      - 'bot/tests/creator*'
      - 'webapp/src/features/creator/**'
      - 'webapp/src/App.jsx'
      - 'webapp/src/pages/Home.jsx'
      - 'webapp/src/index.css'
      - 'webapp/src/components/Layout.jsx'
      - 'webapp/scripts/*creator-auth*'
      - 'webapp/scripts/write-build-metadata.mjs'
      - 'bot/package*.json'
      - '.github/workflows/creator-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  creator-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bot/package-lock.json
            webapp/package-lock.json
      - run: npm ci --prefix bot --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --test bot/tests/creatorSecurity.test.js bot/tests/creatorMedia.test.js bot/tests/creatorStudio.test.js bot/tests/creatorGoogle.test.js bot/tests/creatorKey.test.js bot/tests/creatorOAuth.test.js bot/tests/creatorSocialReturn.test.js
        env:
          CREATOR_TEST_MONGO_URI: mongodb://127.0.0.1:27017/creator_studio_ci
      - run: npm ci --prefix webapp --ignore-scripts --no-audit --no-fund
      - run: node node_modules/vitest/vitest.mjs run --config vitest.creator.config.mjs
        working-directory: webapp
      - run: node --test scripts/creator-auth-config.test.mjs
        working-directory: webapp
      - run: |
          node scripts/write-build-metadata.mjs
          node --max-old-space-size=3072 node_modules/vite/bin/vite.js build
        working-directory: webapp
