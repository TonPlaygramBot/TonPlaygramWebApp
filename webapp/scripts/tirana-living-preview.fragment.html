<div id="tirana-living-preview">
<style>
#tirana-living-preview{font:16px system-ui;color:#eef2ee}
#tirana-living-preview .living-review{max-width:460px;margin:auto;background:#182a30;border-radius:12px;overflow:hidden}
#tirana-living-preview .living-stage{height:520px;position:relative;touch-action:none}
#tirana-living-preview canvas{width:100%;height:100%;display:block}
#tirana-living-preview .living-stage p{position:absolute;padding:20px;background:#182a30}
#tirana-living-preview .living-controls{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#tirana-living-preview label{min-width:0;display:flex;flex-direction:column;gap:6px}
#tirana-living-preview select{min-height:44px;width:100%;font:inherit;background:#29424a;color:#eef2ee;border:1px solid #6d8287;border-radius:6px;padding:7px}
#tirana-living-preview .living-navigation{display:flex;gap:10px;grid-column:1/-1;justify-content:center}
#tirana-living-preview button{font:inherit;min-height:44px;min-width:52px;background:#34525b;color:#fff;border:1px solid #7b9296;border-radius:7px}
@media(max-width:380px){#tirana-living-preview .living-controls{grid-template-columns:1fr}}
</style>
<div id="tirana-living-review-root"></div>
</div>
