import java.io.FileInputStream
import java.io.FileNotFoundException
import java.util.Properties

apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def isReleaseTask = gradle.startParameter.taskNames.any { name ->
    def lowered = name.toLowerCase()
    lowered.contains('release') || lowered.contains('bundle')
}
def configuredVersionCode = System.getenv('ANDROID_VERSION_CODE') ?: '2'
def configuredVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.1.0'
if (!configuredVersionCode.isInteger() || configuredVersionCode.toLong() < 1 || configuredVersionCode.toLong() > 2100000000L) {
    throw new GradleException('ANDROID_VERSION_CODE must be a positive integer no larger than 2100000000.')
}
if (!(configuredVersionName ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException('ANDROID_VERSION_NAME must use major.minor.patch format.')
}

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.tonplaygram.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tonplaygram.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode configuredVersionCode.toInteger()
        versionName configuredVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:*.apk:*.aab:*.jks:*.keystore:keystore.properties'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else if (isReleaseTask) {
                throw new FileNotFoundException("keystore.properties missing; copy keystore.properties.example and fill release signing values.")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else if (isReleaseTask) {
                throw new FileNotFoundException("Release signing requires keystore.properties. Populate it using keystore.properties.example.")
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) apply plugin: 'com.google.gms.google-services'
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
