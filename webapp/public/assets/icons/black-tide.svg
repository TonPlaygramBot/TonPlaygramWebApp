<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">BLACK TIDE</title>
  <desc id="description">A rain-soaked coastal city and a sports car at night.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020610"/>
      <stop offset="0.6" stop-color="#07343b"/>
      <stop offset="1" stop-color="#02070b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101b20"/>
      <stop offset="1" stop-color="#010305"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172b33"/>
      <stop offset="0.55" stop-color="#081116"/>
      <stop offset="1" stop-color="#020507"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f3fdff"/>
      <stop offset="0.48" stop-color="#d9f4f4"/>
      <stop offset="0.5" stop-color="#62f4dc"/>
      <stop offset="1" stop-color="#24cdb5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
